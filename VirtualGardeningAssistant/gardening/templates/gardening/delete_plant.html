<!DOCTYPE html>
<html>
<head>
    <title>Delete Plant</title>
</head>
<body>
    <h1>Delete {{ plant.name }}?</h1>

    <p>Are you sure you want to delete this plant?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <p><a href="{% url 'gardening_home' %}">Cancel</a></p>
</body>
</html>
